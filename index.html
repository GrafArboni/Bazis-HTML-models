<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Модели БАЗИС</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#10171d;color:#dcecf4}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:920px;margin:auto}h1{font-size:24px;margin:0 0 8px}.subtle{color:#92a8b5;margin:0 0 22px}.models{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.card{display:block;padding:16px;border:1px solid #405665;border-radius:10px;background:#17232d;color:inherit;text-decoration:none}.card:hover,.card:focus-visible{border-color:#74d9cf;background:#1d303b;outline:none}.name{display:block;font-weight:700;font-size:16px}.path{display:block;margin-top:7px;color:#92a8b5;font-size:12px;overflow-wrap:anywhere}.error{padding:14px;border:1px solid #9b6060;border-radius:8px;background:#3c2328}button{font:inherit;color:inherit;background:#253846;border:1px solid #526b7b;border-radius:7px;padding:8px 12px;cursor:pointer}
</style>
</head>
<body>
<main>
<h1>Интерактивные модели БАЗИС</h1>
<p class="subtle">Выберите модель. Папки и новые HTML появляются здесь автоматически.</p>
<div class="models" id="models" aria-live="polite">Загрузка списка…</div>
</main>
<script>
(async()=>{
 const mount=document.getElementById('models'),api='https://api.github.com/repos/GrafArboni/Bazis-HTML-models/git/trees/gh-pages?recursive=1';
 const href=path=>'./'+path.split('/').map(encodeURIComponent).join('/').replace(/\/index\.html$/,'/');
 try{
  const response=await fetch(api,{headers:{Accept:'application/vnd.github+json'}});if(!response.ok)throw new Error('GitHub API: '+response.status);
  const data=await response.json(),files=data.tree.filter(item=>item.type==='blob'&&/\.html$/i.test(item.path)&&item.path!=='index.html').sort((a,b)=>a.path.localeCompare(b.path,'ru'));
  mount.textContent='';
  for(const file of files){const link=document.createElement('a'),name=document.createElement('span'),path=document.createElement('span'),parts=file.path.split('/'),folder=parts[parts.length-2],stem=parts[parts.length-1].replace(/\.html$/i,'');link.className='card';link.href=href(file.path);name.className='name';name.textContent=stem==='index'&&folder?folder:stem;path.className='path';path.textContent=file.path;link.append(name,path);mount.append(link);}
  if(!files.length)mount.textContent='Опубликованных моделей пока нет.';
 }catch(error){mount.className='error';mount.textContent='Не удалось получить список моделей. Обновите страницу позже. '+error.message;}
})();
</script>
</body>
</html>
